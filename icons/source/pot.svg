<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Beans manifest">
  <!-- 
    Package Manager: Pot
    Theme: Cohesive with Beans language
  -->
  
  <!-- Pot Handle -->
  <path d="M17 9 h 2 c 1.65 0 3 1.35 3 3 v 3 c 0 1.65 -1.35 3 -3 3 h -2.5" 
        fill="none" 
        stroke="#4E342E" 
        stroke-width="2" 

        fill="#4E342E" />
        
  <!-- Mini Beans Logo Stamp -->
  <g transform="translate(12, 14.5) rotate(40)">
    <ellipse cx="0" cy="0" rx="3" ry="4.5" fill="#D7CCC8" />
    <path d="M 0 -3.5 C -1.5 -1, 1.5 1, 0 3.5" 

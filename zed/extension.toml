id = "beans"
name = "Beans"
description = "Beans language support — Tree-sitter highlighting plus language intelligence from the compiler's built-in language server (beansc lsp)."
version = "0.2.0"
schema_version = 1
authors = ["The Beans authors"]
repository = "https://github.com/beans-lang/editors"

# The Tree-sitter grammar lives in this same repository under
# `tree-sitter-beans/`, which Zed supports through the optional `path` field:
# it clones `repository` at `rev`, joins `path`, then compiles `src/parser.c`
# and `src/scanner.c`.
#
# `rev` MUST be a pushed commit that contains the generated
# `tree-sitter-beans/src/parser.c`. Do not hand-edit it — a revision that does
# not carry the parser fails at install time with a confusing checkout error.
#
# After changing the grammar: regenerate, commit, push, then re-pin.
#   npm run grammar
#   git commit -am "..." && git push
#   node scripts/pin-grammar.mjs --rev <sha>     # refuses a commit without the parser
#   node scripts/pin-grammar.mjs --status
#
# To work on it locally without pushing anything:
#   node scripts/pin-grammar.mjs --local
#
# See editors/zed/README.md.
[grammars.beans]
repository = "https://github.com/beans-lang/editors"
rev = "aae2e5378d3c69063999554b47d2e0e5a2fe0c3b"
path = "tree-sitter-beans"

[language_servers.beansc]
name = "Beans Language Server"
languages = ["Beans"]
